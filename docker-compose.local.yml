services:
  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: mongod --noauth

  api:
    container_name: LibreChat
    image: ghcr.io/holdenstill/stilllibrechat:latest
    restart: unless-stopped
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - PORT=3080
      - DOMAIN_CLIENT=http://localhost:3080
      - DOMAIN_SERVER=http://localhost:3080
      - TRUST_PROXY_AUTH=true
      - PROXY_AUTH_ADMIN_EMAIL=admin@example.com
      - DEBUG_CONSOLE=true
    volumes:
      - lc-images:/app/client/public/images
      - lc-uploads:/app/uploads
      - lc-logs:/app/logs

volumes:
  mongo-data:
  lc-images:
  lc-uploads:
  lc-logs:
